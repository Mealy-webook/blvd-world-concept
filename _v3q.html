<!doctype html><meta charset="utf-8"><style>html,body{margin:0}iframe{border:0;display:block}</style>
<iframe id="f" src="v3.html"></iframe>
<script>
const P=new URLSearchParams(location.search),W=+(P.get("w")||1920),H=+(P.get("h")||1100);
const f=document.getElementById("f");f.style.width=W+"px";f.style.height=H+"px";
f.onload=()=>{const d=f.contentWindow.document;
 setTimeout(()=>{
  for(const id of ["boot","intro"]){const e=d.getElementById(id); if(e)e.remove();}
  d.body.classList.remove("booting"); d.body.classList.add("up");
  const st=d.createElement("style");
  st.textContent='.pricing,.cue,.arch text,.reveal{opacity:1!important;transform:none!important;animation:none!important}';
  d.head.appendChild(st);
 },2600);};
</script>
